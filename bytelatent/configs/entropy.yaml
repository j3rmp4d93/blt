# Template config, need to change dump_dir, data.root_dir and tokenizer.path
# Evals can be activated by uncommenting its config
# python -m launchers.stool config=apps/main/configs/debug.yaml nodes=8 account=fair_amaia_cw_codegen qos=lowest

dump_dir: ./models/transformer_10m/
name: transformer_10m
steps: 19200
probe_freq: null
seed: 777
optim:
  lr: 3e-4
  warmup: 2000
  lr_min_ratio: 3e-5
  clip: 1.0
  beta2: 0.98

distributed:
  fsdp_type: full_shard
  compile: true
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  tp_size: 1

model:
  n_heads: 4
  n_layers: 6
  vocab_size: 258
  max_seqlen: 1024
  dim: 256
  ffn_dim_multiplier: 4

#grad_acc_steps*batch_size=will see this many of examples before update weights
#batch_size = effective batch size
grad_acc_steps: 2
data:
  root_dir: ./data
  sources:
    BLT_shuffled: 1.0
  batch_size: 64
  prefetch_size: 512
  buffer_size: 1024
  seq_len: 1024
  load_async: true
  preprocess_dir: data
  tokenizer_args:
    name: bytes
  entropy_model_name: none

profiling:
  run: false

checkpoint:
  dump:
    every: 512
    keep: 3

logging:
  freq: 10

#no eval model since code is still bugged
#eval:
#  name: entropy_model
