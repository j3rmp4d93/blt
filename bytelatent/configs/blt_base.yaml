# Template config, need to change dump_dir, data.root_dir and tokenizer.path
# Evals can be activated by uncommenting its config
# python -m launchers.stool config=apps/main/configs/debug.yaml nodes=8 account=fair_amaia_cw_codegen qos=lowest

dump_dir: ./models/blt_base/
name: blt_base
steps: 19200
probe_freq: null
seed: 777
optim:
  lr: 3e-4
  warmup: 2000
  lr_min_ratio: 3e-5
  clip: 1.0
  beta2: 0.98

distributed:
  fsdp_type: full_shard
  compile: false
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  tp_size: 1
  dp_replicate: 2
  consistent_sample_count: true

model:
  n_layers_global: 8
  n_layers_local_decoder: 2
  n_layers_local_encoder: 2
  n_heads_local_encoder: 16
  n_heads_local_decoder: 16
  n_heads_global: 16
  dim_global: 512
  dim_local_encoder: 512
  dim_local_decoder: 512
  ffn_dim_multiplier: 1
  vocab_size: 260
  dim_token: 512
  patch_size: 6
  tokenization_mode: "bytes"
  patching_mode: "space"
  tie_local_encoder_decoder_logits: false
  data_loader_patching: true
  max_encoder_seq_length: 1024
  pad_to_max_length: true
  patching_threshold: 3.1439168453216553
  encoder_hash_byte_group_size: [2,3]
  encoder_hash_byte_group_vocab: 20002
  encoder_hash_byte_group_nb_functions: 3
  encoder_enable_byte_ngrams: false
  cross_attn_encoder: true # assuming cross_attention is true
  cross_attn_decoder: true # assuming cross_attention is true
  cross_attn_window_encoder: 1024
  cross_attn_window_decoder: 1024
  cross_attn_k: 8
  cross_attn_nheads: 4
  cross_attn_all_layers_decoder: true
  cross_attn_all_layers_encoder: true
  cross_attn_use_flex_attention: true
  cross_attn_init_by_pooling: true
  log_patch_lengths: true
  non_linearity: "swiglu"
  use_rope: true
  recompute_fc1_out: false
  recompute_fc3_out: false
  recompute_attn: false
  custom_bwd: false
  layer_ckpt: "none"
  efficient_attn: "sdpa"
  patch_only_encoder: false
  patch_only_decoder: false
  use_local_encoder_transformer: true
  init_use_gaussian: true
  init_use_depth: "current"
  attn_bias_type: "block_causal"
  alpha_depth: "disabled"
  max_length: 1024
  local_attention_window_len: 1024
  max_seqlen: 1024
  downsampling_by_pooling: "max"

#grad_acc_steps*batch_size=will see this many of examples before update weights
#batch_size = effective batch size
#current setting is based on 1 gpu with 32gb, 15 sec/step
grad_acc_steps: 8
data:
  root_dir: ./data
  sources:
    fineweb_edu: 1.0
  batch_size: 16
  prefetch_size: 512
  buffer_size: 1024
  seq_len: 1024
  load_async: true
  preprocess_dir: data
  tokenizer_args:
    name: blt
  entropy_model_name: transformer_10m
  patcher_args:
    #threshold is default in the PatcherArgs
    threshold: 1.335442066192627
  max_encoder_seq_length: 1024

profiling:
  run: false

checkpoint:
  dump:
    every: 512
    keep: 3

logging:
  freq: 10

#no eval model since code is still bugged
#eval:
#  name: entropy_model
