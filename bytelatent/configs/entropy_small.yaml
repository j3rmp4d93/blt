# Template config, need to change dump_dir, data.root_dir and tokenizer.path
# Evals can be activated by uncommenting its config
# python -m launchers.stool config=apps/main/configs/debug.yaml nodes=8 account=fair_amaia_cw_codegen qos=lowest

dump_dir: ./models/entropy_small/
name: "entropy_small"
steps: 100_000
probe_freq: null
seed: 777
optim:
  lr: 4e-04
  warmup: 500
  lr_min_ratio: 0.1
  clip: 10.0

distributed:
  fsdp_type: full_shard
  compile: true
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  tp_size: 1

model:
  n_heads: 4
  n_layers: 6
  vocab_size: 258
  max_seqlen: 1024
  dim: 256
  ffn_dim_multiplier: 4

data:
  root_dir: ./data
  sources:
    BLT_shuffled: 1.0
  batch_size: 2
  prefetch_size: 512
  buffer_size: 1024
  seq_len: 1024
  load_async: true
  preprocess_dir: data
  tokenizer_args:
    name: bytes
  entropy_model_name: none

profiling:
  run: false

checkpoint:
  dump:
    every: 500
    keep: 3
  eval:
    every: 1
    keep: 1

logging:
  freq: 10

eval:
  do: true
